function buildMap(){clearFieldEnemy();const map=currentMap(),rows=map.tiles.length,cols=map.tiles[0].length,f=document.createDocumentFragment(),theme=mapTheme(state.mapId),stageLabel='STAGE '+(state.mapId+1)+' '+map.name;AudioEngine.setStage(state.mapId);document.querySelector('.title').textContent='◆ '+stageLabel;document.title=stageLabel+' — Mini RPG';D.map.parentElement.style.setProperty('--cols',cols);D.map.parentElement.style.setProperty('--rows',rows);D.map.parentElement.style.setProperty('--tile','clamp(18px,min(5.35vw,4.5vh),32px)');Object.entries(theme).forEach(([key,value])=>D.map.parentElement.style.setProperty('--map-'+key,value));D.map.parentElement.setAttribute('aria-label',cols+'×'+rows+'の'+map.name);map.tiles.forEach((r,y)=>[...r].forEach((c,x)=>{const e=document.createElement('div');e.className='tile '+TILE[c][0];e.dataset.icon=c==='B'?ENEMIES[map.boss].icon:TILE[c][1];if(c==='B')e.style.setProperty('--icon-hue',enemyHue(map.boss)+'deg');e.dataset.x=x;e.dataset.y=y;f.appendChild(e)}));D.map.replaceChildren(f);refreshMap()}

function renderHighlightedText(element,text,highlights=[]){const names=[...new Set(highlights.filter(Boolean))].sort((a,b)=>b.length-a.length);if(!names.length){element.textContent=text;return}const nodes=[];let cursor=0;while(cursor<text.length){let next=-1,match='';for(const name of names){const index=text.indexOf(name,cursor);if(index>=0&&(next<0||index<next)){next=index;match=name}}if(next<0){nodes.push(document.createTextNode(text.slice(cursor)));break}if(next>cursor)nodes.push(document.createTextNode(text.slice(cursor,next)));const mark=document.createElement('span');mark.className='item-gain';mark.textContent=match;nodes.push(mark);cursor=next+match.length}element.replaceChildren(...nodes)}

function move(dx,dy){if(state.mode!=='exploration')return;const x=state.player.x+dx,y=state.player.y+dy,c=tile(x,y);if(!passable(c)){message(c==='W'?'深い水で先へ進めない。':'険しい地形で先へ進めない。');return}state.player.x=x;state.player.y=y;updatePosition();if(contactFieldEnemy())return;handleTile(c,x,y)}

function clearFieldEnemy(){fieldEnemy=null;if(D.fieldEnemy){D.fieldEnemy.classList.add('hidden');D.fieldEnemy.setAttribute('aria-hidden','true')}}

function handleTile(c,x,y){D.location.textContent=placeName(c);if(c==='H'){state.player.hp=effectiveMaxHp();updateStatus();message('温かな泉の力でHPが全回復した。');return}if(c==='T'){openChest(x,y);return}if(c==='I'){pickUpItem(x,y);return}if(c==='B'&&!state.defeatedBosses.includes(state.mapId)){startBattle(currentMap().boss,'boss');return}if(c==='B'){const n=currentMap().next;if(n)changeMap(n.mapId,n.x,n.y,'扉の先には、'+MAPS[n.mapId].name+'が広がっていた。');return}if(c==='X'){const previous=MAPS[state.mapId-1],r=previous.returnAt;changeMap(state.mapId-1,r.x,r.y,previous.name+'へ戻ってきた。');return}const terrain=terrainAt(c,x,y),baseTerrain=terrain==='dangerForest'?'forest':terrain,sp=specialAt(x,y);message(baseTerrain==='forest'?'木々の間から気配を感じる……':baseTerrain==='wasteland'?'荒れた大地に強い気配が満ちている……':'風が草を揺らしている。');const rate=C.encounterRate[baseTerrain]||0;if(Math.random()<rate){const key=sp&&Math.random()<.2?nextMapEnemy():randomEnemy(state.mapId,terrain);startBattle(key,terrain)}}

function randomRange([min,max]){return min+Math.random()*(max-min)}

const EXPLORE_MISS={common:['辺りを探したが、目ぼしいものはなかった。','静かな時間だけが過ぎていった。','小さな物音がしたが、風のいたずらだった。','足元まで念入りに調べたが、収穫はなかった。','何かの気配を感じたが、すぐに消えてしまった。','遠くを見渡したが、変わったものは見つからなかった。','古い足跡を見つけたが、すでに途切れていた。','少し休んで耳を澄ませたが、何も起こらなかった。'],grass:['草をかき分けてみたが、虫が逃げていっただけだった。','草むらが揺れたが、中には何もいなかった。','風に舞う葉を追ったが、何も見つからなかった。'],forest:['木の根元を調べたが、落ち葉が積もっているだけだった。','茂みの奥まで覗いたが、暗い森が続いていた。','枝の折れる音がしたが、姿は見えなかった。'],wasteland:['乾いた地面を掘ってみたが、石しか出てこなかった。','砂ぼこりが晴れた後にも、何も残っていなかった。','ひび割れた大地を調べたが、収穫はなかった。'],road:['道端を調べたが、古い轍が残っているだけだった。','行き交った旅人の跡はあったが、拾えるものはなかった。','道の先まで目を凝らしたが、変わった様子はなかった。']};
